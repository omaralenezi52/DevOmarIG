name: Build OmarTweak dylib

# Builds the Instagram tweak into a dylib (and .deb) on every push and on
# manual dispatch. The compiled dylib is uploaded as a downloadable artifact.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -e
          # ldid signs the dylib (its absence is the Error 127 during linking);
          # dpkg provides dpkg-deb so `make package` can emit the .deb.
          brew install ldid dpkg make
          echo "LDID=$(command -v ldid)"

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Toolchain: use Xcode's clang (already on the runner).
          echo "Theos installed at $THEOS"

      - name: Fetch iOS SDK
        run: |
          set -e
          # A recent iPhoneOS SDK is required for UIKit/CoreLocation headers.
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks_repo"
          mkdir -p "$THEOS/sdks"
          # Copy the newest iPhoneOS SDK available in the repo.
          SDK=$(ls -d "$HOME/sdks_repo"/iPhoneOS*.sdk | sort -V | tail -n1)
          cp -R "$SDK" "$THEOS/sdks/"
          echo "Using SDK: $SDK"

      - name: Build (package)
        run: |
          set -o pipefail
          make clean || true
          # Capture full output so we can surface compiler diagnostics as
          # annotations (readable via the public API, unlike the raw log).
          make package FINALPACKAGE=1 MESSAGE=1 2>&1 | tee build.log || true
          echo "=== surfacing diagnostics ==="
          # NOTE: Actions runs bash with `set -e`, and grep exits 1 on no-match.
          # A clean build has zero errors, so these greps MUST NOT fail the step
          # — hence the `|| true` guard on each pipeline.
          { grep -nE "error:|Error [0-9]" build.log || true; } | while IFS= read -r line; do
            echo "::error::${line}"
          done
          { grep -n "warning:" build.log || true; } | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          echo "=== build products ==="
          find .theos/obj -name '*.dylib' -print || true
          find packages -type f -print || true
          # Fail the step if no dylib was produced.
          if ! find .theos/obj -name '*.dylib' | grep -q .; then
            echo "::error::Build failed — no OmarTweak.dylib produced"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: OmarTweak-dylib
          path: |
            .theos/obj/**/OmarTweak.dylib
            .theos/obj/OmarTweak.dylib
          if-no-files-found: warn

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: OmarTweak-deb
          path: packages/*.deb
          if-no-files-found: warn
